[connectivity]
# --- 1. Kernel Instantiation (nk) ---
nk=graphyflow_little:1
nk=hbm_writer:1
nk=apply_kernel:1

# --- 2. HBM Port Mapping (sp) ---

# -- Mapping for instance: graphyflow_little_1 --
sp=graphyflow_little_1.edge_props:HBM[0]

# -- Mapping for instance: hbm_writer_1 --
sp=hbm_writer_1.node_props:HBM[1]
sp=hbm_writer_1.output:HBM[1]

# -- Mapping for instance: apply_kernel_1 --
# sp=apply_kernel_1.node_props:HBM[1]

# -- Stream connections --
stream_connect=graphyflow_little_1.ppb_req_stream:hbm_writer_1.ppb_req_stream:16
stream_connect=hbm_writer_1.ppb_resp_stream:graphyflow_little_1.ppb_resp_stream:16
stream_connect=graphyflow_little_1.kernel_out_stream:apply_kernel_1.kernel_out_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream:apply_kernel_1.cacheline_data_stream:16
stream_connect=apply_kernel_1.write_burst_stream:hbm_writer_1.write_burst_stream:16

slr=graphyflow_little_1:SLR0
slr=hbm_writer_1:SLR0
slr=apply_kernel_1:SLR0
