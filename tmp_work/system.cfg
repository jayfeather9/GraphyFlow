[connectivity]
# --- 1. Kernel Instantiation (nk) ---
nk=graphyflow_big:3
nk=apply_kernel:3
nk=hbm_writer:1

# --- 2. HBM Port Mapping (sp) ---

# -- Mapping for instance: graphyflow_big_1 --
sp=graphyflow_big_1.edge_props:HBM[0]
sp=graphyflow_big_2.edge_props:HBM[2]
sp=graphyflow_big_3.edge_props:HBM[4]

# -- Mapping for instance: hbm_writer_1 --
sp=hbm_writer_1.node_props_1:HBM[1]
sp=hbm_writer_1.output_1:HBM[1]
sp=hbm_writer_1.node_props_2:HBM[3]
sp=hbm_writer_1.output_2:HBM[3]
sp=hbm_writer_1.node_props_3:HBM[5]
sp=hbm_writer_1.output_3:HBM[5]

# -- Stream connections --

# graphyflow_big <-> hbm_writer_1 : cacheline streams
stream_connect=graphyflow_big_1.cacheline_req_stream:hbm_writer_1.cacheline_req_stream_1:16
stream_connect=hbm_writer_1.cacheline_resp_stream_1:graphyflow_big_1.cacheline_resp_stream:16
stream_connect=graphyflow_big_2.cacheline_req_stream:hbm_writer_1.cacheline_req_stream_2:16
stream_connect=hbm_writer_1.cacheline_resp_stream_2:graphyflow_big_2.cacheline_resp_stream:16
stream_connect=graphyflow_big_3.cacheline_req_stream:hbm_writer_1.cacheline_req_stream_3:16
stream_connect=hbm_writer_1.cacheline_resp_stream_3:graphyflow_big_3.cacheline_resp_stream:16

# graphyflow_big -> apply_kernel
stream_connect=graphyflow_big_1.kernel_out_stream:apply_kernel_1.kernel_out_stream:16
stream_connect=graphyflow_big_2.kernel_out_stream:apply_kernel_2.kernel_out_stream:16
stream_connect=graphyflow_big_3.kernel_out_stream:apply_kernel_3.kernel_out_stream:16

# hbm_writer_1 -> apply_kernel : cacheline data streams
stream_connect=hbm_writer_1.cacheline_data_stream_1:apply_kernel_1.cacheline_data_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream_2:apply_kernel_2.cacheline_data_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream_3:apply_kernel_3.cacheline_data_stream:16

# apply_kernel -> hbm_writer_1 : write burst streams
stream_connect=apply_kernel_1.write_burst_stream:hbm_writer_1.write_burst_stream_1:16
stream_connect=apply_kernel_2.write_burst_stream:hbm_writer_1.write_burst_stream_2:16
stream_connect=apply_kernel_3.write_burst_stream:hbm_writer_1.write_burst_stream_3:16

slr=graphyflow_big_1:SLR2
slr=graphyflow_big_2:SLR1
slr=graphyflow_big_3:SLR2

slr=apply_kernel_1:SLR1
slr=apply_kernel_2:SLR1
slr=apply_kernel_3:SLR1

slr=hbm_writer_1:SLR0
