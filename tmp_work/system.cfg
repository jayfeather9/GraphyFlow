[connectivity]
# --- 1. Kernel Instantiation (nk) ---
nk=graphyflow_big:3:graphyflow_big_1.graphyflow_big_2.graphyflow_big_3
nk=graphyflow_little:3:graphyflow_little_1.graphyflow_little_2.graphyflow_little_3

# --- 2. HBM Port Mapping (sp) ---

# -- Mapping for instance: graphyflow_big_1 --
sp=graphyflow_big_1.src_offsets:HBM[0]
sp=graphyflow_big_1.edge_props:HBM[0]
sp=graphyflow_big_1.node_props:HBM[0]
sp=graphyflow_big_1.output:HBM[1]

# -- Mapping for instance: graphyflow_big_2 --
sp=graphyflow_big_2.src_offsets:HBM[2]
sp=graphyflow_big_2.edge_props:HBM[2]
sp=graphyflow_big_2.node_props:HBM[2]
sp=graphyflow_big_2.output:HBM[3]

# -- Mapping for instance: graphyflow_big_3 --
sp=graphyflow_big_3.src_offsets:HBM[4]
sp=graphyflow_big_3.edge_props:HBM[4]
sp=graphyflow_big_3.node_props:HBM[4]
sp=graphyflow_big_3.output:HBM[5]

# -- Mapping for instance: graphyflow_little_1 --
sp=graphyflow_little_1.src_offsets:HBM[6]
sp=graphyflow_little_1.edge_props:HBM[6]
sp=graphyflow_little_1.node_props:HBM[6]
sp=graphyflow_little_1.output:HBM[7]

# -- Mapping for instance: graphyflow_little_2 --
sp=graphyflow_little_2.src_offsets:HBM[8]
sp=graphyflow_little_2.edge_props:HBM[8]
sp=graphyflow_little_2.node_props:HBM[8]
sp=graphyflow_little_2.output:HBM[9]

# -- Mapping for instance: graphyflow_little_3 --
sp=graphyflow_little_3.src_offsets:HBM[10]
sp=graphyflow_little_3.edge_props:HBM[10]
sp=graphyflow_little_3.node_props:HBM[10]
sp=graphyflow_little_3.output:HBM[11]
