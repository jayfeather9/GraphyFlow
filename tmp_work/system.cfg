[connectivity]
# --- 1. Kernel Instantiation (nk) ---
nk=graphyflow_little:2
nk=graphyflow_big:2
nk=hbm_writer_little:2
nk=hbm_writer_big:2
nk=apply_kernel:4

# --- 2. HBM Port Mapping (sp) ---

# -- Mapping for instance: graphyflow_little_1 --
sp=graphyflow_little_1.edge_props:HBM[0]

# -- Mapping for instance: graphyflow_little_2 --
sp=graphyflow_little_2.edge_props:HBM[1]

# -- Mapping for instance: graphyflow_big_1 --
sp=graphyflow_big_1.edge_props:HBM[28]

# -- Mapping for instance: graphyflow_big_2 --
sp=graphyflow_big_2.edge_props:HBM[30]

# -- Mapping for instance: hbm_writer_little_1 --
sp=hbm_writer_little_1.node_props:HBM[9]
sp=hbm_writer_little_1.output:HBM[9]
sp=apply_kernel_1.node_props:HBM[9]

# -- Mapping for instance: hbm_writer_little_2 --
sp=hbm_writer_little_2.node_props:HBM[10]
sp=hbm_writer_little_2.output:HBM[10]
sp=apply_kernel_2.node_props:HBM[10]

# -- Mapping for instance: hbm_writer_big_1 --
sp=hbm_writer_big_1.node_props:HBM[11]
sp=hbm_writer_big_1.output:HBM[11]
sp=apply_kernel_3.node_props:HBM[11]

# -- Mapping for instance: hbm_writer_big_2 --
sp=hbm_writer_big_2.node_props:HBM[12]
sp=hbm_writer_big_2.output:HBM[12]
sp=apply_kernel_4.node_props:HBM[12]

# --- 3. Stream Connections ---

# -- Stream connections for graphyflow_little_1 and apply_kernel_1 --
stream_connect=graphyflow_little_1.ppb_req_stream:hbm_writer_little_1.ppb_req_stream:16
stream_connect=hbm_writer_little_1.ppb_resp_stream:graphyflow_little_1.ppb_resp_stream:16
stream_connect=graphyflow_little_1.kernel_out_stream:apply_kernel_1.kernel_out_stream:16
stream_connect=apply_kernel_1.write_burst_stream:hbm_writer_little_1.write_burst_stream:16

# -- Stream connections for graphyflow_little_2 and apply_kernel_2 --
stream_connect=graphyflow_little_2.ppb_req_stream:hbm_writer_little_2.ppb_req_stream:16
stream_connect=hbm_writer_little_2.ppb_resp_stream:graphyflow_little_2.ppb_resp_stream:16
stream_connect=graphyflow_little_2.kernel_out_stream:apply_kernel_2.kernel_out_stream:16
stream_connect=apply_kernel_2.write_burst_stream:hbm_writer_little_2.write_burst_stream:16

# -- Stream connections for graphyflow_big_1 and apply_kernel_3 --
stream_connect=graphyflow_big_1.cacheline_req_stream:hbm_writer_big_1.cacheline_req_stream:16
stream_connect=hbm_writer_big_1.cacheline_resp_stream:graphyflow_big_1.cacheline_resp_stream:16
stream_connect=graphyflow_big_1.kernel_out_stream:apply_kernel_3.kernel_out_stream:16
stream_connect=apply_kernel_3.write_burst_stream:hbm_writer_big_1.write_burst_stream:16

# -- Stream connections for graphyflow_big_2 and apply_kernel_4 --
stream_connect=graphyflow_big_2.cacheline_req_stream:hbm_writer_big_2.cacheline_req_stream:16
stream_connect=hbm_writer_big_2.cacheline_resp_stream:graphyflow_big_2.cacheline_resp_stream:16
stream_connect=graphyflow_big_2.kernel_out_stream:apply_kernel_4.kernel_out_stream:16
stream_connect=apply_kernel_4.write_burst_stream:hbm_writer_big_2.write_burst_stream:16

# --- 4. SLR Placement ---
slr=graphyflow_little_1:SLR0
slr=graphyflow_little_2:SLR0
slr=graphyflow_big_1:SLR1
slr=graphyflow_big_2:SLR2
slr=hbm_writer_little_1:SLR0
slr=hbm_writer_little_2:SLR0
slr=hbm_writer_big_1:SLR1
slr=hbm_writer_big_2:SLR2
slr=apply_kernel_1:SLR0
slr=apply_kernel_2:SLR0
slr=apply_kernel_3:SLR1
slr=apply_kernel_4:SLR2
