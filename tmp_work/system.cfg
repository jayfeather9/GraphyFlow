[connectivity]
# --- 1. Kernel Instantiation (nk) ---
nk=graphyflow_big:2:graphyflow_big_1.graphyflow_big_2
nk=graphyflow_little:2:graphyflow_little_1.graphyflow_little_2

# --- 2. HBM Port Mapping (sp) ---

# -- Mapping for instance: graphyflow_big_1 --
# All 3 input ports (gmem0, gmem1, gmem2) connect to HBM[0]
sp=graphyflow_big_1.m_axi_gmem0:HBM[0]
sp=graphyflow_big_1.m_axi_gmem1:HBM[0]
sp=graphyflow_big_1.m_axi_gmem2:HBM[0]
# Output port (gmem3) connects to HBM[1]
sp=graphyflow_big_1.m_axi_gmem3:HBM[1]

# -- Mapping for instance: graphyflow_big_2 --
# All 3 input ports (gmem0, gmem1, gmem2) connect to HBM[2]
sp=graphyflow_big_2.m_axi_gmem0:HBM[2]
sp=graphyflow_big_2.m_axi_gmem1:HBM[2]
sp=graphyflow_big_2.m_axi_gmem2:HBM[2]
# Output port (gmem3) connects to HBM[3]
sp=graphyflow_big_2.m_axi_gmem3:HBM[3]

# -- Mapping for instance: graphyflow_little_1 --
# All 3 input ports (gmem0, gmem1, gmem2) connect to HBM[4]
sp=graphyflow_little_1.m_axi_gmem0:HBM[4]
sp=graphyflow_little_1.m_axi_gmem1:HBM[4]
sp=graphyflow_little_1.m_axi_gmem2:HBM[4]
# Output port (gmem3) connects to HBM[5]
sp=graphyflow_little_1.m_axi_gmem3:HBM[5]

# -- Mapping for instance: graphyflow_little_2 --
# All 3 input ports (gmem0, gmem1, gmem2) connect to HBM[6]
sp=graphyflow_little_2.m_axi_gmem0:HBM[6]
sp=graphyflow_little_2.m_axi_gmem1:HBM[6]
sp=graphyflow_little_2.m_axi_gmem2:HBM[6]
# Output port (gmem3) connects to HBM[7]
sp=graphyflow_little_2.m_axi_gmem3:HBM[7]