[connectivity]
# --- 1. Kernel Instantiation (nk) ---
nk=graphyflow_little:2
nk=graphyflow_big:2
nk=hbm_writer:1
nk=apply_kernel:4

# --- 2. HBM Port Mapping (sp) ---

# -- Mapping for instance: graphyflow_little_1 --
sp=graphyflow_little_1.edge_props:HBM[0]

# -- Mapping for instance: graphyflow_little_2 --
sp=graphyflow_little_2.edge_props:HBM[1]

# -- Mapping for instance: graphyflow_little_3 --
; sp=graphyflow_little_3.edge_props:HBM[2]

# -- Mapping for instance: graphyflow_big_1 --
sp=graphyflow_big_1.edge_props:HBM[28]

# -- Mapping for instance: graphyflow_big_2 --
sp=graphyflow_big_2.edge_props:HBM[30]

# -- Mapping for instance: hbm_writer_1 --
sp=hbm_writer_1.node_props_1:HBM[9]
sp=hbm_writer_1.output_1:HBM[9]
sp=hbm_writer_1.node_props_2:HBM[10]
sp=hbm_writer_1.output_2:HBM[10]
sp=hbm_writer_1.node_props_3:HBM[11]
sp=hbm_writer_1.output_3:HBM[11]
sp=hbm_writer_1.node_props_4:HBM[12]
sp=hbm_writer_1.output_4:HBM[12]

# --- 3. Stream Connections ---

# -- Stream connections for graphyflow_little_1 and apply_kernel_1 --
stream_connect=graphyflow_little_1.ppb_req_stream:hbm_writer_1.ppb_req_stream_1:16
stream_connect=hbm_writer_1.ppb_resp_stream_1:graphyflow_little_1.ppb_resp_stream:16
stream_connect=graphyflow_little_1.kernel_out_stream:apply_kernel_1.kernel_out_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream_1:apply_kernel_1.cacheline_data_stream:16
stream_connect=apply_kernel_1.write_burst_stream:hbm_writer_1.write_burst_stream_1:16

# -- Stream connections for graphyflow_little_2 and apply_kernel_2 --
stream_connect=graphyflow_little_2.ppb_req_stream:hbm_writer_1.ppb_req_stream_2:16
stream_connect=hbm_writer_1.ppb_resp_stream_2:graphyflow_little_2.ppb_resp_stream:16
stream_connect=graphyflow_little_2.kernel_out_stream:apply_kernel_2.kernel_out_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream_2:apply_kernel_2.cacheline_data_stream:16
stream_connect=apply_kernel_2.write_burst_stream:hbm_writer_1.write_burst_stream_2:16

# -- Stream connections for graphyflow_big_1 and apply_kernel_3 --
stream_connect=graphyflow_big_1.cacheline_req_stream:hbm_writer_1.cacheline_req_stream_3:16
stream_connect=hbm_writer_1.cacheline_resp_stream_3:graphyflow_big_1.cacheline_resp_stream:16
stream_connect=graphyflow_big_1.kernel_out_stream:apply_kernel_3.kernel_out_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream_3:apply_kernel_3.cacheline_data_stream:16
stream_connect=apply_kernel_3.write_burst_stream:hbm_writer_1.write_burst_stream_3:16

# -- Stream connections for graphyflow_big_2 and apply_kernel_4 --
stream_connect=graphyflow_big_2.cacheline_req_stream:hbm_writer_1.cacheline_req_stream_4:16
stream_connect=hbm_writer_1.cacheline_resp_stream_4:graphyflow_big_2.cacheline_resp_stream:16
stream_connect=graphyflow_big_2.kernel_out_stream:apply_kernel_4.kernel_out_stream:16
stream_connect=hbm_writer_1.cacheline_data_stream_4:apply_kernel_4.cacheline_data_stream:16
stream_connect=apply_kernel_4.write_burst_stream:hbm_writer_1.write_burst_stream_4:16

# --- 4. SLR Placement ---
slr=graphyflow_little_1:SLR1
slr=graphyflow_little_2:SLR2
slr=graphyflow_big_1:SLR1
slr=graphyflow_big_2:SLR2
slr=hbm_writer_1:SLR0
slr=apply_kernel_1:SLR1
slr=apply_kernel_2:SLR2
slr=apply_kernel_3:SLR1
slr=apply_kernel_4:SLR2
