[connectivity]
# --- 1. 内核实例化 ---
# 创建 1 个 big 内核实例
nk=graphyflow_big:1:graphyflow_big_1

# 创建 2 个 little 内核实例
nk=graphyflow_little:2:graphyflow_little_1.graphyflow_little_2

# --- 2. HBM 通道映射 ---
# 将 big 内核的端口连接到 HBM bank 0, 1, 2
sp=graphyflow_big_1.m_axi_gmem0:HBM[0]
sp=graphyflow_big_1.m_axi_gmem1:HBM[1]
sp=graphyflow_big_1.m_axi_gmem2:HBM[2]

# 将第一个 little 内核的端口连接到 HBM bank 4, 5, 6
sp=graphyflow_little_1.m_axi_gmem0:HBM[4]
sp=graphyflow_little_1.m_axi_gmem1:HBM[5]
sp=graphyflow_little_1.m_axi_gmem2:HBM[6]

# 将第二个 little 内核的端口连接到 HBM bank 8, 9, 10
sp=graphyflow_little_2.m_axi_gmem0:HBM[8]
sp=graphyflow_little_2.m_axi_gmem1:HBM[9]
sp=graphyflow_little_2.m_axi_gmem2:HBM[10]