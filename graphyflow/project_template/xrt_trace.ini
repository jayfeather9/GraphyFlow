[Debug]
# Enable runtime profiling/trace collection (used for deriving cycle counts from
# Vitis hw_emu traces).
#
# NOTE: XRT 2.18+ uses these keys (older keys like 'timeline_trace' are ignored).
device_trace=fine
opencl_trace=true
device_counters=true
stall_trace=true
continuous_trace=true

# Avoid trace buffer overflow on longer runs.
trace_buffer_size=64M
trace_buffer_offload_interval_ms=10

